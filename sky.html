<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030712" />
  <title>تلسکوپ کهکشانی | OLDMAN - شهریار</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg: #030712;
      --gold: #f5c56b;
      --gold-soft: #fde68a;
      --sky: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    body {
      margin: 0;
      padding: 14px 12px 32px;
      min-height: 100vh;
      font-family: "Vazirmatn", system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 25%, rgba(56, 189, 248, 0.1), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(245, 197, 107, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .back-btn {
      padding: 7px 13px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .title-pill {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--gold-soft);
      background: rgba(245, 197, 107, 0.12);
      border: 1px solid rgba(245, 197, 107, 0.35);
      padding: 6px 12px;
      border-radius: 99px;
    }

    /* قاب دایره‌ای تلسکوپ */
    .telescope-shell {
      position: relative;
      width: min(88vw, 370px);
      height: min(88vw, 370px);
      border-radius: 50%;
      padding: 8px;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 70%, #020617 100%);
      border: 2px solid rgba(245, 197, 107, 0.55);
      box-shadow:
        0 0 0 5px rgba(15, 23, 42, 0.9),
        0 0 38px rgba(56, 189, 248, 0.2),
        inset 0 0 28px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #skyCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #020617;
      touch-action: none;
      cursor: grab;
    }

    #skyCanvas:active { cursor: grabbing; }

    .readout-bar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      font-size: 0.72rem;
    }

    .readout-lbl { color: var(--muted); font-size: 0.65rem; display: block; }
    .readout-val { color: var(--gold-soft); font-weight: 800; direction: ltr; display: inline-block; }

    .primary-sensor-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.55);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(14, 165, 233, 0.28));
      color: #e0f2fe;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-sensor-btn.active {
      border-color: rgba(74, 222, 128, 0.65);
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.24), rgba(16, 185, 129, 0.28));
      color: #dcfce7;
    }

    .controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .toggle-btn {
      padding: 8px 6px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(15, 23, 42, 0.8);
      color: var(--muted);
      font-family: inherit;
      font-size: 0.71rem;
      font-weight: 700;
      cursor: pointer;
    }

    .toggle-btn.on {
      border-color: var(--gold);
      background: rgba(245, 197, 107, 0.15);
      color: var(--gold-soft);
    }

    .zoom-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.72rem;
      color: #cbd5e1;
    }

    .zoom-row input[type="range"] {
      flex: 1;
      accent-color: var(--sky);
    }

    .status-note {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);

    function deg2rad(d) { return d * Math.PI / 180; }
    function rad2deg(r) { return r * 180 / Math.PI; }

    // تبدیل سمت و ارتفاع به بردار سه‌بعدی (East, North, Up)
    function azAltToVec(azDeg, altDeg) {
      const az = deg2rad(azDeg);
      const alt = deg2rad(altDeg);
      const cAlt = Math.cos(alt);
      return {
        e: cAlt * Math.sin(az),
        n: cAlt * Math.cos(az),
        u: Math.sin(alt)
      };
    }

    function dot(a, b) { return a.e * b.e + a.n * b.n + a.u * b.u; }
    function cross(a, b) {
      return {
        e: a.n * b.u - a.u * b.n,
        n: a.u * b.e - a.e * b.u,
        u: a.e * b.n - a.n * b.e
      };
    }
    function normalize(v) {
      const len = Math.hypot(v.e, v.n, v.u) || 1;
      return { e: v.e / len, n: v.n / len, u: v.u / len };
    }

    // تصویرسازی نقطه سه‌بعدی روی دایره‌ی تلسکوپ
    function projectPoint(vec, camBasis, cx, cy, radius) {
      const z = dot(vec, camBasis.fwd);
      if (z <= 0.05) return null; // پشت دوربین
      const x = dot(vec, camBasis.right);
      const y = dot(vec, camBasis.up);
      const scale = radius / Math.tan(deg2rad(state.fovDeg / 2));
      const sx = cx + (x / z) * scale;
      const sy = cy - (y / z) * scale;
      return { x: sx, y: sy, dist: Math.hypot(sx - cx, sy - cy) };
    }

    function computeSkyObjects() {
      if (!window.Astronomy) return { stars: [], planets: [], ecliptic: [] };
      const A = window.Astronomy;
      const now = new Date();
      const obs = new A.Observer(state.lat, state.lon, 0);

      const stars = STARS.map(s => {
        const hor = A.Horizon(now, obs, s.ra, s.dec, "normal");
        return { ...s, az: hor.azimuth, alt: hor.altitude, vec: azAltToVec(hor.azimuth, hor.altitude) };
      });

      const planets = PLANETS_DEF.map(p => {
        const eq = A.Equator(A.Body[p.key], now, obs, true, true);
        const hor = A.Horizon(now, obs, eq.ra, eq.dec, "normal");
        return { ...p, az: hor.azimuth, alt: hor.altitude, vec: azAltToVec(hor.azimuth, hor.altitude) };
      });

      // نقاط دایرةالبروج (هر ۱۵ درجه)
      const ecliptic = [];
      const obliq = deg2rad(23.439);
      for (let lon = 0; lon < 360; lon += 10) {
        const lRad = deg2rad(lon);
        const raRad = Math.atan2(Math.sin(lRad) * Math.cos(obliq), Math.cos(lRad));
        const decRad = Math.asin(Math.sin(obliq) * Math.sin(lRad));
        const raH = ((rad2deg(raRad) / 15) + 24) % 24;
        const decD = rad2deg(decRad);
        const hor = A.Horizon(now, obs, raH, decD, "normal");
        ecliptic.push(azAltToVec(hor.azimuth, hor.altitude));
      }

      return { stars, planets, ecliptic };
    }

    let cachedSky = computeSkyObjects();
    setInterval(() => { cachedSky = computeSkyObjects(); }, 15000);

    function drawFrame() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const cx = w / 2;
      const cy = h / 2;
      const radius = Math.min(cx, cy) - 2;

      ctx.clearRect(0, 0, w, h);

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.clip();

      // پس‌زمینه آسمان (گرادیان عمیق کیهانی)
      const bgGrad = ctx.createRadialGradient(cx, cy, radius * 0.1, cx, cy, radius);
      bgGrad.addColorStop(0, "#0b132b");
      bgGrad.addColorStop(1, "#020617");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // ساخت پایه دوربین
      const fwd = azAltToVec(state.viewAz, state.viewAlt);
      const worldUp = { e: 0, n: 0, u: 1 };
      let right = cross(fwd, worldUp);
      if (Math.hypot(right.e, right.n, right.u) < 0.001) {
        right = { e: 1, n: 0, u: 0 };
      } else {
        right = normalize(right);
      }
      const up = cross(right, fwd);
      const cam = { fwd, right, up };

      // رسم خط افق و جهات اصلی
      ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      let started = false;
      for (let a = 0; a <= 360; a += 5) {
        const pt = projectPoint(azAltToVec(a, 0), cam, cx, cy, radius);
        if (pt && pt.dist < radius * 1.4) {
          if (!started) { ctx.moveTo(pt.x, pt.y); started = true; }
          else ctx.lineTo(pt.x, pt.y);
        } else {
          started = false;
        }
      }
      ctx.stroke();

      // جهات جغرافیایی روی افق
      const cardinals = [
        { az: 0, lbl: "شمال N" }, { az: 90, lbl: "شرق E" },
        { az: 180, lbl: "جنوب S" }, { az: 270, lbl: "غرب W" }
      ];
      ctx.font = "700 10px Vazirmatn, sans-serif";
      ctx.fillStyle = "rgba(125, 211, 252, 0.8)";
      ctx.textAlign = "center";
      cardinals.forEach(c => {
        const pt = projectPoint(azAltToVec(c.az, 2), cam, cx, cy, radius);
        if (pt && pt.dist < radius - 14) {
          ctx.fillText(c.lbl, pt.x, pt.y);
        }
      });

      // رسم خط دایرةالبروج
      if (state.opts.ecliptic && cachedSky.ecliptic.length > 0) {
        ctx.strokeStyle = "rgba(245, 197, 107, 0.28)";
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1;
        ctx.beginPath();
        let ecStart = false;
        for (let i = 0; i <= cachedSky.ecliptic.length; i++) {
          const v = cachedSky.ecliptic[i % cachedSky.ecliptic.length];
          const pt = projectPoint(v, cam, cx, cy, radius);
          if (pt && pt.dist < radius * 1.5) {
            if (!ecStart) { ctx.moveTo(pt.x, pt.y); ecStart = true; }
            else ctx.lineTo(pt.x, pt.y);
          } else {
            ecStart = false;
          }
        }
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // تصویرسازی ستاره‌ها
      const projStars = cachedSky.stars.map(s => ({
        s,
        pt: projectPoint(s.vec, cam, cx, cy, radius)
      }));

      // خطوط صور فلکی
      if (state.opts.constellations) {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.38)";
        ctx.lineWidth = 1.1;
        CONSTELLATIONS.forEach(c => {
          let sumX = 0, sumY = 0, count = 0;
          c.lines.forEach(([i1, i2]) => {
            const p1 = projStars[i1]?.pt;
            const p2 = projStars[i2]?.pt;
            if (p1 && p2 && p1.dist < radius * 1.5 && p2.dist < radius * 1.5) {
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
              sumX += (p1.x + p2.x) / 2;
              sumY += (p1.y + p2.y) / 2;
              count++;
            }
          });
          if (state.opts.labels && count > 0) {
            const mx = sumX / count;
            const my = sumY / count;
            if (Math.hypot(mx - cx, my - cy) < radius - 22) {
              ctx.font = "700 9.5px Vazirmatn, sans-serif";
              ctx.fillStyle = "rgba(148, 163, 184, 0.72)";
              ctx.fillText(c.name, mx, my);
            }
          }
        });
      }

      // رسم ستاره‌ها
      projStars.forEach(({ s, pt }) => {
        if (!pt || pt.dist > radius) return;
        const size = Math.max(1.3, 3.6 - s.mag * 0.55);
        ctx.fillStyle = s.c || "#ffffff";
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
        ctx.fill();

        if (state.opts.labels && s.fa && s.mag <= 2.1) {
          ctx.font = "600 9px Vazirmatn, sans-serif";
          ctx.fillStyle = "rgba(226, 232, 240, 0.85)";
          ctx.fillText(s.fa, pt.x, pt.y - size - 4);
        }
      });

      // رسم خورشید، ماه و سیارات
      cachedSky.planets.forEach(p => {
        const pt = projectPoint(p.vec, cam, cx, cy, radius);
        if (!pt || pt.dist > radius) return;

        // هاله نورانی
        const g = ctx.createRadialGradient(pt.x, pt.y, 1, pt.x, pt.y, p.r * 2.4);
        g.addColorStop(0, p.glow);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, p.r * 2.4, 0, Math.PI * 2);
        ctx.fill();

        // حلقه زحل
        if (p.ring) {
          ctx.strokeStyle = "rgba(252, 211, 77, 0.75)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.ellipse(pt.x, pt.y, p.r * 1.9, p.r * 0.6, -0.35, 0, Math.PI * 2);
          ctx.stroke();
        }

        // جسم سیاره
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        if (state.opts.labels) {
          ctx.font = "800 10.5px Vazirmatn, sans-serif";
          ctx.fillStyle = p.color;
          ctx.fillText(p.fa, pt.x, pt.y - p.r - 6);
        }
      });

      // نشانه‌گر مرکز تلسکوپ (Crosshair)
      ctx.strokeStyle = "rgba(245, 197, 107, 0.3)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy); ctx.lineTo(cx - 3, cy);
      ctx.moveTo(cx + 3, cy);  ctx.lineTo(cx + 10, cy);
      ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy - 3);
      ctx.moveTo(cx, cy + 3);  ctx.lineTo(cx, cy + 10);
      ctx.stroke();

      ctx.restore();

      // به‌روزرسانی اعداد نمایشگر
      document.getElementById("azVal").textContent = Math.round((state.viewAz + 360) % 360) + "°";
      document.getElementById("altVal").textContent = (state.viewAlt >= 0 ? "+" : "") + Math.round(state.viewAlt) + "°";

      requestAnimationFrame(drawFrame);
    }

    // چرخش لمسی (دستی)
    let isDragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener("pointerdown", e => {
      if (state.sensorActive) return;
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener("pointermove", e => {
      if (!isDragging || state.sensorActive) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      const sens = state.fovDeg / 260;
      state.viewAz = (state.viewAz - dx * sens + 360) % 360;
      state.viewAlt = Math.max(-85, Math.min(89, state.viewAlt + dy * sens));
    });
    window.addEventListener("pointerup", () => { isDragging = false; });

    // پردازش سنسور ژیرسکوپ و قطب‌نما (مختصات سه‌بعدی بدون قفل گیمبال)
    function handleOrientation(ev) {
      if (!state.sensorActive) return;
      if (ev.alpha === null || ev.beta === null || ev.gamma === null) return;

      const a = deg2rad(ev.alpha);
      const b = deg2rad(ev.beta);
      const g = deg2rad(ev.gamma);

      // بردار پشت گوشی در مختصات شرق-شمال-بالا
      const rawE = -Math.cos(a) * Math.sin(g) - Math.sin(a) * Math.sin(b) * Math.cos(g);
      const rawN = -Math.sin(a) * Math.sin(g) + Math.cos(a) * Math.sin(b) * Math.cos(g);
      const rawU = -Math.cos(b) * Math.cos(g);

      if (!state.smoothVec) {
        state.smoothVec = { e: rawE, n: rawN, u: rawU };
      } else {
        const k = 0.22; // فیلتر نرم‌کننده ضدلرزش
        state.smoothVec.e += (rawE - state.smoothVec.e) * k;
        state.smoothVec.n += (rawN - state.smoothVec.n) * k;
        state.smoothVec.u += (rawU - state.smoothVec.u) * k;
      }

      const v = normalize(state.smoothVec);
      state.viewAz = (rad2deg(Math.atan2(v.e, v.n)) + 360) % 360;
      state.viewAlt = rad2deg(Math.asin(Math.max(-1, Math.min(1, v.u))));
    }

    async function toggleSensorMode() {
      const btn = document.getElementById("sensorToggleBtn");
      const note = document.getElementById("statusNote");

      if (state.sensorActive) {
        state.sensorActive = false;
        window.removeEventListener("deviceorientationabsolute", handleOrientation, true);
        window.removeEventListener("deviceorientation", handleOrientation, true);
        btn.classList.remove("active");
        btn.textContent = "📡 فعال‌سازی سنسور قطب‌نما و GPS (رصد زنده)";
        note.textContent = "حالت لمسی فعال شد؛ با انگشت روی دایره بکشید تا آسمان را بچرخانید.";
        return;
      }

      // درخواست مجوز برای iOS در صورت نیاز
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        try {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm !== "granted") {
            note.textContent = "اجازه دسترسی به سنسور جهت‌یابی داده نشد.";
            return;
          }
        } catch (e) {}
      }

      // دریافت GPS
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            state.lat = pos.coords.latitude;
            state.lon = pos.coords.longitude;
            state.gpsLocked = true;
            document.getElementById("gpsVal").textContent = `${state.lat.toFixed(2)}, ${state.lon.toFixed(2)}`;
            cachedSky = computeSkyObjects();
          },
          () => {
            document.getElementById("gpsVal").textContent = "تهران (پیش‌فرض)";
          },
          { enableHighAccuracy: false, timeout: 6000 }
        );
      }

      state.sensorActive = true;
      state.smoothVec = null;
      if ("ondeviceorientationabsolute" in window) {
        window.addEventListener("deviceorientationabsolute", handleOrientation, true);
      } else {
        window.addEventListener("deviceorientation", handleOrientation, true);
      }

      btn.classList.add("active");
      btn.textContent = "🟢 سنسور زنده فعال است (لمس برای توقف)";
      note.textContent = "گوشی را به سمت آسمان بگیرید. اگر جهت قطب‌نما کمی انحراف داشت، گوشی را یک بار به شکل عدد ۸ در هوا بچرخانید.";
    }

    function toggleOpt(key, btnEl) {
      state.opts[key] = !state.opts[key];
      btnEl.classList.toggle("on", state.opts[key]);
    }

    function updateFov(val) {
      state.fovDeg = Number(val);
      document.getElementById("fovLbl").textContent = val + "°";
    }

    requestAnimationFrame(drawFrame);
  </script>
</body>
</html>
