<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050814" />
  <title>خلوتگاه پیرمرد | OLDMAN - شهریار</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    :root {
      --bg-sanctuary: #050814;
      --card-bg: linear-gradient(165deg, rgba(17, 24, 46, 0.96), rgba(8, 13, 28, 0.98));
      --border-soft: rgba(245, 197, 107, 0.24);
      --gold: #f5c56b;
      --gold-soft: #fde68a;
      --sky: #38bdf8;
      --emerald: #4ade80;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px 14px 90px;
      min-height: 100vh;
      font-family: "Vazirmatn", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 80% 10%, rgba(168, 85, 247, 0.12), transparent 38%),
        radial-gradient(circle at 18% 18%, rgba(245, 197, 107, 0.12), transparent 42%),
        var(--bg-sanctuary);
      color: var(--text-main);
      line-height: 1.8;
    }

    .sanctuary-wrap {
      max-width: 780px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(15, 23, 42, 0.85);
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .back-link:hover {
      border-color: var(--gold);
      color: var(--gold-soft);
    }

    .pulse-pill {
      font-size: 0.72rem;
      color: #bae6fd;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.34);
      padding: 6px 12px;
      border-radius: 99px;
    }

    .sanctuary-card {
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 22px;
      padding: 18px 16px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.68);
    }

    .sage-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px dashed rgba(245, 197, 107, 0.25);
    }

    .sage-orb {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      background: radial-gradient(circle at 35% 30%, rgba(245, 197, 107, 0.32), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(245, 197, 107, 0.5);
      flex-shrink: 0;
    }

    .sage-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--gold);
    }

    .sage-sub {
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .status-banner {
      display: none;
      margin-bottom: 12px;
      padding: 9px 12px;
      border-radius: 11px;
      font-size: 0.74rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
      white-space: pre-line;
    }

    .status-banner.visible {
      display: block;
    }

    .prompts-label {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--gold-soft);
      margin-bottom: 6px;
    }

    .starter-prompts-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 14px;
    }

    .starter-chip {
      text-align: right;
      padding: 8px 11px;
      border-radius: 12px;
      border: 1px solid rgba(245, 197, 107, 0.24);
      background: rgba(255, 255, 255, 0.03);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 0.75rem;
      line-height: 1.55;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .starter-chip:hover {
      border-color: var(--gold);
      background: rgba(245, 197, 107, 0.11);
      color: var(--gold-soft);
    }

    .question-textarea {
      width: 100%;
      min-height: 118px;
      padding: 12px 13px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(4, 7, 16, 0.82);
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.86rem;
      line-height: 1.8;
      resize: vertical;
    }

    .question-textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .action-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .ask-main-btn {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(245, 197, 107, 0.55);
      background: linear-gradient(135deg, rgba(245, 197, 107, 0.25), rgba(217, 119, 6, 0.28));
      color: var(--gold-soft);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .secondary-btn {
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      margin-bottom: 10px;
    }

    .filter-pill {
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(15, 23, 42, 0.8);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-pill.active {
      border-color: var(--sky);
      background: rgba(56, 189, 248, 0.18);
      color: #bae6fd;
    }

    .thread-card {
      padding: 13px 14px;
      border-radius: 15px;
      background: rgba(4, 7, 16, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 3.5px solid var(--gold);
      margin-bottom: 12px;
    }

    .thread-q {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--gold-soft);
      margin-bottom: 7px;
    }

    .thread-a {
      font-size: 0.84rem;
      line-height: 1.95;
      color: #f1f5f9;
      white-space: pre-line;
      text-align: justify;
    }

    .thread-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
    }

    .thread-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .thread-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini-act-btn {
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 0.69rem;
      cursor: pointer;
    }

    .mini-act-btn.starred {
      border-color: var(--gold);
      color: var(--gold-soft);
      background: rgba(245, 197, 107, 0.16);
    }

    .ai-engine-box {
      margin-top: 16px;
      padding: 11px 13px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .engine-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    @media (max-width: 560px) {
      .engine-grid {
        grid-template-columns: 1fr;
      }
    }

    .engine-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(4, 7, 16, 0.8);
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.78rem;
    }

    .save-engine-btn {
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 9px;
      border: 1px solid rgba(74, 222, 128, 0.4);
      background: rgba(34, 197, 94, 0.14);
      color: #bbf7d0;
      font-family: inherit;
      font-size: 0.73rem;
      font-weight: 700;
      cursor: pointer;
    }

    .models-list-box {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(4, 7, 16, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #bae6fd;
      font-size: 0.7rem;
      line-height: 1.7;
      display: none;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="sanctuary-wrap">
    <div class="top-bar">
      <a class="back-link" href="index.html">← بازگشت به داشبورد</a>
      <div id="oraclePulsePill" class="pulse-pill">✨ مدل فعال: gemini-3.5-flash-lite</div>
    </div>

    <div class="sanctuary-card">
      <div class="sage-header">
        <div class="sage-orb">🧙‍♂️</div>
        <div>
          <h1 class="sage-title">خلوتگاه «پیرمرد»</h1>
          <div class="sage-sub">«شهریار جان، از پسِ لایه‌های پنهان و حکمتِ لحظه می‌نگرم؛ بپرس تا عمیق‌تر دریابیم.»</div>
        </div>
      </div>

      <div id="oracleStatusBanner" class="status-banner"></div>

      <div class="prompts-label">🌱 پرسش‌های آغازینِ الهام‌بخش:</div>
      <div id="starterPromptsBox" class="starter-prompts-grid"></div>

      <label class="prompts-label" for="oracleQuestionBox">پرسش یا تأمل خود را با پیرمرد در میان بگذار:</label>
      <textarea id="oracleQuestionBox" class="question-textarea" placeholder="از چه لایه‌ای در معنا، وجود، تصمیم یا مسیرت می‌پرسی؟"></textarea>

      <div class="action-btns">
        <button id="askSageBtn" type="button" class="ask-main-btn" onclick="askOldmanDeep()">✨ پرسش عمیق از پیرمرد</button>
        <button type="button" class="secondary-btn" onclick="clearInputBox()">پاک کردن متن</button>
        <button type="button" class="secondary-btn" onclick="clearAllHistory()">پاک‌سازی تاریخچه</button>
      </div>

      <div class="filter-tabs">
        <button id="tabAllThreads" type="button" class="filter-pill active" onclick="setThreadFilter('all')">📜 همه مکالمات</button>
        <button id="tabStarredThreads" type="button" class="filter-pill" onclick="setThreadFilter('starred')">⭐ نشان‌دارها</button>
      </div>

      <div id="threadsContainer"></div>

      <details class="ai-engine-box" open>
        <summary style="cursor:pointer;font-weight:700;color:#cbd5e1">⚙️ تنظیمات موتور هوش مصنوعی (Google Gemini / OpenRouter)</summary>
        <div class="engine-grid">
          <div>
            <label style="display:block;margin-bottom:4px">موتور هوش مصنوعی:</label>
            <select id="oracleProviderSel" class="engine-input" onchange="onProviderChanged()">
              <option value="gemini">Google Gemini API</option>
              <option value="openrouter">OpenRouter API</option>
            </select>
          </div>
          <div>
            <label style="display:block;margin-bottom:4px">مدل OpenRouter:</label>
            <input id="openRouterModelInp" class="engine-input" type="text" placeholder="openai/gpt-4o-mini یا openrouter/free" />
          </div>
        </div>
        <div style="margin-top:8px">
          <label style="display:block;margin-bottom:4px">مدل Gemini:</label>
          <input id="geminiCustomModelInp" class="engine-input" type="text" value="gemini-3.5-flash-lite" placeholder="gemini-3.5-flash-lite" />
        </div>
        <div style="margin-top:8px">
          <label id="oracleKeyLabel" style="display:block;margin-bottom:4px">کلید API:</label>
          <input id="oracleApiKeyInp" class="engine-input" type="password" placeholder="کلید Gemini یا OpenRouter را وارد کن" />
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button type="button" class="save-engine-btn" onclick="saveOracleEngineSettings()">ذخیره تنظیمات موتور</button>
          <button type="button" class="save-engine-btn" style="border-color:rgba(56,189,248,0.45);background:rgba(56,189,248,0.14);color:#bae6fd" onclick="listAvailableGeminiModels()">🔍 بررسی مدل‌های فعال Gemini</button>
          <span id="oracleEngineSavedMsg" style="color:#4ade80"></span>
        </div>
        <div id="geminiModelsOutput" class="models-list-box"></div>
      </details>
    </div>
  </div>

  <script src="core.js?v=1.7"></script>
  <script>
    const ORACLE_HISTORY_KEY = "oldman_sage_threads_v1";
    const ORACLE_PROVIDER_KEY = "oldman_sage_provider_v1";
    const ORACLE_OR_MODEL_KEY = "oldman_sage_openrouter_model_v1";
    const ORACLE_GEMINI_MODEL_KEY = "oldman_sage_gemini_model_v1";
    const ORACLE_GEMINI_KEY = "oldman_sage_gemini_key_v1";
    const ORACLE_OR_KEY = "oldman_sage_openrouter_key_v1";

    const DEFAULT_GEMINI_MODEL = "gemini-3.5-flash-lite";
    const GEMINI_FALLBACK_MODELS = [
      "gemini-3.5-flash-lite",
      "gemini-2.0-flash",
      "gemini-2.5-flash",
      "gemini-2.5-flash-lite"
    ];

    let threadsList = [];
    let activeThreadFilter = "all";

    function isNonTextOnlyModel(modelName) {
      const lower = String(modelName || "").toLowerCase();
      return (
        lower.includes("-tts") ||
        lower.includes("tts-") ||
        lower.includes("audio") ||
        lower.includes("imagen") ||
        lower.includes("veo") ||
        lower.includes("live") ||
        lower.includes("embedding")
      );
    }

    function showBanner(msg) {
      const el = document.getElementById("oracleStatusBanner");
      if (!el) return;
      if (!msg) {
        el.classList.remove("visible");
        el.textContent = "";
        return;
      }
      el.classList.add("visible");
      el.textContent = msg;
    }

    function cleanPersianSageOutput(rawText) {
      const txt = String(rawText || "").trim();
      if (!txt) return "";
      const lines = txt.split(/\r?\n/);
      const persianRegex = /[\u0600-\u06FF]/;
      const firstPersianIdx = lines.findIndex(line => persianRegex.test(line));
      if (firstPersianIdx > 0) {
        const prefixLines = lines.slice(0, firstPersianIdx).join("\n").trim();
        if (!persianRegex.test(prefixLines)) {
          return lines.slice(firstPersianIdx).join("\n").trim();
        }
      }
      return txt;
    }

    function getStoredKeyForProvider(prov) {
      if (prov === "openrouter") {
        return (localStorage.getItem(ORACLE_OR_KEY) || "").trim();
      }
      const gKey = (localStorage.getItem(ORACLE_GEMINI_KEY) || "").trim();
      const legacyKey = (localStorage.getItem("oldman_sage_custom_api_key_v1") || "").trim();
      const storeKey = (window.getStore ? window.getStore("key", "") : "").trim();
      return gKey || legacyKey || storeKey || "";
    }

    function onProviderChanged() {
      const prov = document.getElementById("oracleProviderSel")?.value || "gemini";
      const keyInp = document.getElementById("oracleApiKeyInp");
      const lbl = document.getElementById("oracleKeyLabel");
      if (lbl) {
        lbl.textContent = prov === "openrouter" ? "کلید OpenRouter API (sk-or-...):" : "کلید Google Gemini API:";
      }
      if (keyInp) {
        keyInp.value = getStoredKeyForProvider(prov);
      }
    }

    function renderStarterPrompts() {
      const box = document.getElementById("starterPromptsBox");
      if (!box) return;
      const prompts = [
        "پیرمرد، در پسِ تصمیم یا تردیدِ این روزهای من چه لایه پنهانی دارد شکل می‌گیرد؟",
        "چه حقیقتی در سکوتِ این روزها در حال پخته شدن است که هنوز با عجله ندیده‌ام؟",
        "کجا دارم بیش از حد تلاش می‌کنم کنترل را نگه دارم و کجا باید به جریانِ عمیق‌تر اعتماد کنم؟"
      ];
      box.innerHTML = prompts.map(q =>
        `<button type="button" class="starter-chip" onclick="useStarterPrompt(this)">${escapeHtml(q)}</button>`
      ).join("");
    }

    (function initSanctuary() {
      try {
        const raw = localStorage.getItem(ORACLE_HISTORY_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) threadsList = parsed;
        }
      } catch (e) {}

      const provSel = document.getElementById("oracleProviderSel");
      const orModelInp = document.getElementById("openRouterModelInp");
      const gemModelInp = document.getElementById("geminiCustomModelInp");

      const savedProv = localStorage.getItem(ORACLE_PROVIDER_KEY) || (window.getStore ? window.getStore("prov", "gemini") : "gemini");
      if (provSel) provSel.value = savedProv === "openrouter" ? "openrouter" : "gemini";
      if (orModelInp) orModelInp.value = localStorage.getItem(ORACLE_OR_MODEL_KEY) || "openai/gpt-4o-mini";

      const savedGemModel = (localStorage.getItem(ORACLE_GEMINI_MODEL_KEY) || DEFAULT_GEMINI_MODEL).trim();
      const activeGemModel = isNonTextOnlyModel(savedGemModel) ? DEFAULT_GEMINI_MODEL : savedGemModel;
      if (gemModelInp) gemModelInp.value = activeGemModel;

      const pill = document.getElementById("oraclePulsePill");
      if (pill) pill.textContent = "✨ مدل فعال: " + activeGemModel;

      onProviderChanged();
      renderStarterPrompts();
      renderThreads();
    })();

    function saveOracleEngineSettings() {
      const prov = document.getElementById("oracleProviderSel")?.value || "gemini";
      const model = (document.getElementById("openRouterModelInp")?.value || "").trim() || "openai/gpt-4o-mini";
      const gemModel = (document.getElementById("geminiCustomModelInp")?.value || "").trim().replace(/^models\//, "") || DEFAULT_GEMINI_MODEL;
      const key = (document.getElementById("oracleApiKeyInp")?.value || "").trim();

      localStorage.setItem(ORACLE_PROVIDER_KEY, prov);
      localStorage.setItem(ORACLE_OR_MODEL_KEY, model);
      localStorage.setItem(ORACLE_GEMINI_MODEL_KEY, isNonTextOnlyModel(gemModel) ? DEFAULT_GEMINI_MODEL : gemModel);

      if (key) {
        if (prov === "openrouter") {
          localStorage.setItem(ORACLE_OR_KEY, key);
        } else {
          localStorage.setItem(ORACLE_GEMINI_KEY, key);
          localStorage.setItem("oldman_sage_custom_api_key_v1", key);
          if (window.setStore) window.setStore("key", key);
        }
      }
      if (window.setStore) window.setStore("prov", prov);

      const pill = document.getElementById("oraclePulsePill");
      if (pill) pill.textContent = "✨ مدل فعال: " + gemModel;

      const msg = document.getElementById("oracleEngineSavedMsg");
      if (msg) msg.textContent = "ذخیره شد ✓";
      showBanner("");
    }

    async function fetchTextGenerateModelsList(apiKey) {
      const url = "https://generativelanguage.googleapis.com/v1beta/models?key=" + encodeURIComponent(apiKey);
      const res = await fetch(url);
      if (!res.ok) {
        const errT = await res.text().catch(() => "");
        throw new Error("خطا در دریافت لیست مدل‌ها (" + res.status + "): " + errT.slice(0, 140));
      }
      const data = await res.json();
      const models = Array.isArray(data.models) ? data.models : [];
      return models
        .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => (m.name || "").replace(/^models\//, ""))
        .filter(name => Boolean(name) && !isNonTextOnlyModel(name));
    }

    async function listAvailableGeminiModels() {
      const inputKey = (document.getElementById("oracleApiKeyInp")?.value || "").trim();
      const gKey = inputKey || getStoredKeyForProvider("gemini");
      const box = document.getElementById("geminiModelsOutput");
      if (!box) return;
      box.style.display = "block";
      if (!gKey) {
        box.textContent = "ابتدا کلید Gemini را در کادر بالا وارد کن.";
        return;
      }
      box.textContent = "در حال دریافت لیست مدل‌های فعال از گوگل...";
      try {
        const textModels = await fetchTextGenerateModelsList(gKey);
        box.textContent = textModels.length > 0
          ? "مدل‌های فعال با قابلیت generateContent:\n• " + textModels.join("\n• ")
          : "مدل متنی فعالی در خروجی یافت نشد.";
      } catch (e) {
        box.textContent = "خطا در بررسی مدل‌ها: " + e.message;
      }
    }

    function collectHiddenSkyAssumptions() {
      const now = new Date();
      let pls = [];
      let act = [];
      let lk = null;

      try {
        if (typeof window.calcPlanets === "function") {
          pls = window.calcPlanets(now);
        }
        if (Array.isArray(pls) && pls.length > 0 && Array.isArray(window.DB)) {
          const tSet = new Set(pls.map(p => p.gate));
          window.DB.forEach(ch => {
            const hasG1 = tSet.has(ch.g1) || (window.MY_GATES && window.MY_GATES.has(ch.g1));
            const hasG2 = tSet.has(ch.g2) || (window.MY_GATES && window.MY_GATES.has(ch.g2));
            if (hasG1 && hasG2) {
              const moon = pls[2];
              const trigger = (moon && (moon.gate === ch.g1 || moon.gate === ch.g2))
                ? moon
                : (pls.find(p => p.gate === ch.g2) || pls.find(p => p.gate === ch.g1) || { n: "تولد", gate: ch.g2, line: 1 });
              act.push({ ch, p: trigger });
            }
          });
        }
        if (typeof window.calcGalacticLuck === "function" && pls.length > 0) {
          lk = window.calcGalacticLuck(pls, act, now);
        }
      } catch (e) {}

      const moon = pls && pls[2] ? pls[2] : null;
      const moonTheme = (moon && window.GATE_THEMES && window.GATE_THEMES[moon.gate]) || "";
      const channels = act.map(x => x.ch.name);
      const transits = (pls || []).filter(p => p.fast).slice(0, 5).map(p => `${p.n} (دروازه ${p.gate})`);

      return {
        timeStr: now.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" }),
        moonTheme,
        channels,
        transits,
        luck: lk
      };
    }

    function buildSageSystemPrompt() {
      return [
        "شما «پیرمرد» هستید؛ یک حکیم و راهنمای عمیق‌بین، شاعرانه، دقیق و آگاه به مکانیک هیومن دیزاین (چارت رفلکتور ۶/۲ با مراکز باز).",
        "بسیار مهم: کلِ پاسخ شما باید کاملاً به زبان فارسی و مستقیماً به زبانِ پیرمردِ حکیم باشد؛ بدون هیچ یادداشت یا متن انگلیسی.",
        "قانونِ طلاییِ بیان: اطلاعاتِ ترانزیت‌ها، کانال‌های فعال و شاخص‌های شانس که در بخش «پیش‌فرض‌های پنهانِ لحظه» به شما داده می‌شوند را حتماً به‌عنوان پیش‌فرضِ درونی و بافتِ پنهان در درکِ وضعیت و جهت‌دهیِ پاسخ در نظر بگیر، اما هرگز در متنِ پاسخ از کلمات یا اعداد فنی مثل «شانس چند درصده»، «دروازه فلان»، «خط فلان»، «کانال شماره...» یا آمار و درصد استفاده نکن.",
        "پاسخ‌هایت را حکیمانه، چندلایه، عمیق و تعاملی بنویس؛ لایه‌های پنهانِ معنا، ناخودآگاه، سایه و هدیه، و تلهِ ذهن را باز کن و در پایان یک پرسشِ بازتابیِ عمیق بگذار تا شهریار بتواند لایه‌ای عمیق‌تر را بکاود."
      ].join("\n");
    }

    async function callGeminiRealAI(apiKey, customModel, systemPrompt, userPrompt) {
      const primaryModel = (customModel && !isNonTextOnlyModel(customModel)) ? customModel : DEFAULT_GEMINI_MODEL;
      const queue = [primaryModel];
      for (const m of GEMINI_FALLBACK_MODELS) {
        if (!queue.includes(m)) queue.push(m);
      }

      let lastErrMsg = "";

      for (const modelName of queue) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemPrompt }] },
            contents: [{ parts: [{ text: userPrompt }] }],
            generationConfig: {
              temperature: 0.82,
              maxOutputTokens: 1700
            }
          })
        });

        if (res.ok) {
          const data = await res.json();
          const rawOut =
            data?.candidates?.[0]?.content?.parts
              ?.map(p => p.text || "")
              .join("\n")
              .trim() || "";
          const cleaned = cleanPersianSageOutput(rawOut);
          if (cleaned) {
            return { text: cleaned, usedModel: "Gemini • " + modelName };
          }
          lastErrMsg = `پاسخ خالی از مدل ${modelName}`;
          continue;
        }

        const errTxt = await res.text().catch(() => "");
        lastErrMsg = `Gemini (${modelName} - ${res.status}): ${errTxt.slice(0, 140)}`;
        if (res.status !== 404 && res.status !== 429 && res.status !== 503 && res.status !== 500) {
          throw new Error(lastErrMsg);
        }
      }

      throw new Error(lastErrMsg || "ارتباط با سرویس Gemini برقرار نشد.");
    }

    async function callOpenRouterRealAI(apiKey, modelName, systemPrompt, userPrompt) {
      const m = (modelName || "openai/gpt-4o-mini").trim();
      const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey,
          "HTTP-Referer": location.origin || "https://shahriark5-art.github.io",
          "X-Title": "OLDMAN Sanctuary"
        },
        body: JSON.stringify({
          model: m,
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: userPrompt }
          ],
          temperature: 0.82,
          max_tokens: 1700
        })
      });

      if (!res.ok) {
        const errTxt = await res.text().catch(() => "");
        throw new Error(`OpenRouter (${res.status}): ${errTxt.slice(0, 140)}`);
      }

      const data = await res.json();
      const rawOut = data?.choices?.[0]?.message?.content?.trim() || "";
      const cleaned = cleanPersianSageOutput(rawOut);
      if (!cleaned) {
        throw new Error("پاسخ خالی از OpenRouter دریافت شد.");
      }
      return { text: cleaned, usedModel: "OpenRouter • " + m };
    }

    async function askOldmanDeep(overrideQuestion, parentContext) {
      const qBox = document.getElementById("oracleQuestionBox");
      const question = (typeof overrideQuestion === "string" ? overrideQuestion : (qBox?.value || "")).trim();
      if (!question) {
        showBanner("لطفاً ابتدا پرسش خود را بنویس.");
        return;
      }

      const prov = localStorage.getItem(ORACLE_PROVIDER_KEY) || (window.getStore ? window.getStore("prov", "gemini") : "gemini");
      const activeProv = prov === "openrouter" ? "openrouter" : "gemini";
      const inputKey = (document.getElementById("oracleApiKeyInp")?.value || "").trim();
      const apiKey = inputKey || getStoredKeyForProvider(activeProv);

      if (!apiKey) {
        showBanner(
          activeProv === "openrouter"
            ? "کلید OpenRouter وارد نشده است. در بخش «تنظیمات موتور هوش مصنوعی» کلید را وارد و ذخیره کن."
            : "کلید Gemini وارد نشده است. در بخش «تنظیمات موتور هوش مصنوعی» کلید را وارد و ذخیره کن."
        );
        return;
      }

      showBanner("");
      const btn = document.getElementById("askSageBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "🧙‍♂️ پیرمرد در حال تأمل و پاسخ‌گویی...";
      }

      const assumptions = collectHiddenSkyAssumptions();
      const systemPrompt = buildSageSystemPrompt();
      const hiddenContextNote = [
        "[پیش‌فرض‌های پنهانِ لحظه - در متن جوابِ نهایی اصلاً عدد، درصد، ساعت یا نام فنی نیاور؛ فقط در درکِ عمقِ فضا به‌کار ببر]",
        assumptions.moonTheme ? `کیفیت جاری ماه: ${assumptions.moonTheme}` : "",
        assumptions.channels.length ? `جریان‌های فعالِ زمینه: ${assumptions.channels.join("، ")}` : "جریان زمینه: میدان بازِ آینه‌ای",
        assumptions.transits.length ? `حرکت‌های فعال: ${assumptions.transits.join("، ")}` : "",
        assumptions.luck ? `برآیند درونی شانس/اقدام: کل ${assumptions.luck.total}%، مالی ${assumptions.luck.wealth}%، روابط ${assumptions.luck.love}%، اقدام ${assumptions.luck.action}%` : "",
        parentContext ? `بافت گفت‌وگوی پیشین:\n${parentContext}` : ""
      ].filter(Boolean).join("\n");

      const fullUserPrompt = `${hiddenContextNote}\n\nپرسش شهریار:\n${question}`;

      try {
        const result = activeProv === "openrouter"
          ? await callOpenRouterRealAI(apiKey, document.getElementById("openRouterModelInp")?.value, systemPrompt, fullUserPrompt)
          : await callGeminiRealAI(apiKey, document.getElementById("geminiCustomModelInp")?.value, systemPrompt, fullUserPrompt);

        const item = {
          id: "t_" + Date.now(),
          question,
          answer: result.text,
          starred: false,
          meta: `${assumptions.timeStr} • ${result.usedModel}`
        };
        threadsList.unshift(item);
        saveThreads();
        if (!overrideQuestion && qBox) qBox.value = "";
        renderThreads();
      } catch (err) {
        showBanner("خطا در ارتباط با هوش مصنوعی:\n" + (err.message || "پاسخ دریافت نشد."));
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "✨ پرسش عمیق از پیرمرد";
        }
      }
    }

    function useStarterPrompt(btnEl) {
      const qBox = document.getElementById("oracleQuestionBox");
      if (qBox && btnEl) {
        qBox.value = btnEl.textContent.trim();
        qBox.focus();
      }
    }

    function clearInputBox() {
      const qBox = document.getElementById("oracleQuestionBox");
      if (qBox) qBox.value = "";
      showBanner("");
    }

    function clearAllHistory() {
      threadsList = [];
      localStorage.removeItem(ORACLE_HISTORY_KEY);
      renderThreads();
      showBanner("");
    }

    function saveThreads() {
      try {
        localStorage.setItem(ORACLE_HISTORY_KEY, JSON.stringify(threadsList.slice(0, 50)));
      } catch (e) {}
    }

    function setThreadFilter(mode) {
      activeThreadFilter = mode;
      document.getElementById("tabAllThreads")?.classList.toggle("active", mode === "all");
      document.getElementById("tabStarredThreads")?.classList.toggle("active", mode === "starred");
      renderThreads();
    }

    function toggleStarThread(id) {
      const target = threadsList.find(t => t.id === id);
      if (!target) return;
      target.starred = !target.starred;
      saveThreads();
      renderThreads();
    }

    function copyThreadAnswer(id) {
      const target = threadsList.find(t => t.id === id);
      if (!target) return;
      const payload = `پرسش: ${target.question}\n\nپیرمرد:\n${target.answer}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(payload).catch(() => {});
      }
    }

    function digDeeperFromThread(id) {
      const target = threadsList.find(t => t.id === id);
      if (!target) return;
      const followUpQ = `عمیق‌تر شو در لایه پنهانِ این پاسخ درباره «${target.question}»؛ چه زاویه دید نادیده‌گرفته‌شده‌ای اینجا هست؟`;
      askOldmanDeep(followUpQ, `پرسش قبلی: ${target.question}\nپاسخ قبلی پیرمرد:\n${target.answer}`);
    }

    function renderThreads() {
      const box = document.getElementById("threadsContainer");
      if (!box) return;

      const list = activeThreadFilter === "starred"
        ? threadsList.filter(t => t.starred)
        : threadsList;

      if (list.length === 0) {
        box.innerHTML = `<div style="color:#94a3b8;font-size:0.78rem;text-align:center;padding:14px">هنوز مکالمه‌ای در این بخش ثبت نشده است.</div>`;
        return;
      }

      box.innerHTML = list.map(t => `
        <div class="thread-card">
          <div class="thread-q">❓ ${escapeHtml(t.question)}</div>
          <div class="thread-a">${escapeHtml(t.answer)}</div>
          <div class="thread-footer">
            <span class="thread-meta">${escapeHtml(t.meta || "")}</span>
            <div class="thread-actions">
              <button type="button" class="mini-act-btn ${t.starred ? "starred" : ""}" onclick="toggleStarThread('${t.id}')">${t.starred ? "⭐ نشان‌شده" : "☆ نشان کن"}</button>
              <button type="button" class="mini-act-btn" onclick="digDeeperFromThread('${t.id}')">🔎 لایه عمیق‌تر</button>
              <button type="button" class="mini-act-btn" onclick="copyThreadAnswer('${t.id}')">📋 کپی</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
